<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
  <title>Study Sprint Board</title>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="mx-auto max-w-6xl p-4 md:p-8">
    <h1 class="mb-6 text-3xl font-bold text-violet-700">🗂️ Study Sprint Board</h1>
    <!-- PROGRESS -->
    <section id="stats" aria-labelledby="statsTitle" class="mb-6 rounded-xl bg-white p-4 shadow">
      <h2 id="statsTitle" class="mb-3 font-bold text-slate-600">Progress</h2>

      <dl class="grid grid-cols-2 gap-3 text-center sm:grid-cols-4">
        <div class="rounded-lg bg-slate-50 p-3">
          <dt class="text-sm text-slate-500">Total</dt>
          <dd id="statTotal" class="text-2xl font-bold">0</dd>
        </div>
        <div class="rounded-lg bg-slate-50 p-3">
          <dt class="text-sm text-slate-500">To Do</dt>
          <dd id="statTodo" class="text-2xl font-bold">0</dd>
        </div>
        <div class="rounded-lg bg-slate-50 p-3">
          <dt class="text-sm text-slate-500">In Progress</dt>
          <dd id="statInprogress" class="text-2xl font-bold">0</dd>
        </div>
        <div class="rounded-lg bg-slate-50 p-3">
          <dt class="text-sm text-slate-500">Done</dt>
          <dd id="statDone" class="text-2xl font-bold">0</dd>
        </div>
      </dl>

      <div class="mt-4">
        <div class="mb-1 flex justify-between text-sm font-semibold">
          <span>Completion</span>
          <span id="statPercent">0%</span>
        </div>
        <div
          id="progressTrack"
          role="progressbar"
          aria-label="Completion percentage"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          class="h-3 w-full overflow-hidden rounded-full bg-slate-200"
        >
          <div id="progressFill" class="h-full bg-green-500 transition-all" style="width: 0%"></div>
        </div>
      </div>
    </section>
    <!-- TOOLBAR -->
    <div id="toolbar" class="mb-6 flex flex-wrap gap-3 rounded-xl bg-white p-4 shadow">
      <input
        type="search"
        id="searchInput"
        aria-label="Search tasks by title or subject"
        placeholder="Search title or subject..."
        class="min-w-48 flex-1 rounded-lg border border-slate-300 px-3 py-2 focus:outline-2 focus:outline-violet-500"
        >
        <select
          id="priorityFilter"
          aria-label="Filter by priority"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 focus:outline-2 focus:outline-violet-500"
          >
            <option value="all">All priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button
        type="button"
        id="clearFiltersBtn"
        class="hidden rounded-lg border border-slate-300 px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100"
        >
          Clear Filters
        </button>
        <button
        type="button"
        id="resetBoardBtn"
        class="rounded-lg border border-red-200 px-4 py-2 font-semibold text-red-600 hover:bg-red-50"
        >
          Reset Board
        </button>
    </div>
    <!-- ADD TASK FORM -->
    <form id="taskForm" class="mb-6 flex flex-wrap items-end gap-3 rounded-xl bg-white p-4 shadow">
      <div class="flex min-w-48 flex-1 flex-col gap-1">
        <label for="titleInput" class="text-sm font-semibold">Title</label>
        <input type="text" id="titleInput" aria-describedby="titleError" class="rounded-lg border border-slate-300 px-3 py-2 focus:outline-2 focus:outline-violet-500 aria-invalid:border-red-500">
        <p id="titleError" role="alert" class="text-sm font-semibold text-red-600"></p>
      </div>

      <div class="flex min-w-48 flex-1 flex-col gap-1">
        <label for="subjectInput" class="text-sm font-semibold">Subject</label>
        <input type="text" id="subjectInput" aria-describedby="subjectError" class="rounded-lg border border-slate-300 px-3 py-2 focus:outline-2 focus:outline-violet-500 aria-invalid:border-red-500">
        <p id="subjectError" role="alert" class="text-sm font-semibold text-red-600"></p>
      </div>

      <div class="flex flex-col gap-1">
        <label for="priorityInput" class="text-sm font-semibold">Priority</label>
        <select id="priorityInput" class="rounded-lg border border-slate-300 px-3 py-2 focus:outline-2 focus:outline-violet-500">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="rounded-lg bg-violet-600 px-5 py-2 font-bold text-white hover:bg-violet-700">Add Task</button>
      <button type="button" id="cancelEditBtn" class="hidden rounded-lg border border-slate-300 px-5 py-2 font-bold text-slate-600 hover:bg-slate-100">Cancel</button>

    </form>
    <!-- BOARD -->
    <div class="grid gap-4 md:grid-cols-3">
      <section class="min-w-0 rounded-xl bg-white p-4 shadow">
        <h2 class="mb-3 font-bold text-slate-600">To Do</h2>
        <div class="flex flex-col gap-3" id="todo-list"></div>
      </section>

      <section class="min-w-0 rounded-xl bg-white p-4 shadow">
        <h2 class="mb-3 font-bold text-slate-600">In Progress</h2>
        <div class="flex flex-col gap-3" id="inprogress-list"></div>
      </section>

      <section class="min-w-0 rounded-xl bg-white p-4 shadow">
        <h2 class="mb-3 font-bold text-slate-600">Done</h2>
        <div class="flex flex-col gap-3" id="done-list"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
